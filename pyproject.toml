[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asase-reader"
dynamic = ["version"]
description = "批量下载 B 站专栏（opus）中的图片，并作为离线漫画阅读器使用"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "tenacity>=8.2",
    "pathvalidate>=3.2",
    "pywebview>=5.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "asase_reader.__version__" }

[tool.setuptools.package-data]
asase_reader = ["assets/*.html"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
asase-reader = "asase_reader.cli:main"

[project.urls]
Homepage = "https://github.com/tiger-forest/AsaseReader"
